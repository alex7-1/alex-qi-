<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>合同信息收集 · Alex Qi</title>
<style>
:root {
  --bg: #F0F5F1;
  --ink: #1F3024;
  --ink-soft: #3D5A45;
  --muted: #7A9680;
  --line: #C9D6CB;
  --wash: #E8EFE9;
  --soft: #FAFBFA;
  --danger: #C0392B;
  --white: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  padding: 20px 16px 40px;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

.page {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.brand-header {
  text-align: center;
  margin-bottom: 16px;
  padding: 20px 16px 16px;
  background: var(--ink);
  border-radius: 14px;
}

.brand-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 10px;
  border: 2px solid var(--ink-soft);
  background: var(--wash);
}

.brand-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 25%;
}

.brand-name {
  font-size: 16px;
  font-weight: 500;
  color: var(--white);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.brand-tag {
  display: inline-block;
  padding: 2px 10px;
  background: var(--ink-soft);
  color: var(--wash);
  font-size: 10px;
  letter-spacing: 2px;
  border-radius: 3px;
  margin-bottom: 10px;
}

.brand-title {
  font-size: 15px;
  color: var(--white);
  font-weight: 500;
  letter-spacing: 1px;
}

.type-switcher,
.business-product-switcher {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.type-switcher {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.business-product-switcher {
  display: none;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.type-btn,
.product-btn {
  min-height: 58px;
  padding: 10px 6px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  color: var(--ink-soft);
  cursor: pointer;
  text-align: center;
  line-height: 1.35;
  transition: all 0.15s;
}

.product-btn {
  min-height: 46px;
  font-size: 12.5px;
  color: var(--ink);
}

.type-main {
  display: block;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 500;
}

.type-sub {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10.5px;
}

.type-btn.active,
.product-btn.active {
  background: var(--ink);
  border-color: var(--ink);
}

.type-btn.active .type-main,
.type-btn.active .type-sub,
.product-btn.active {
  color: var(--white);
}

.security-box {
  background: var(--wash);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
}

.security-top {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 8px;
}

.security-icon {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  background: var(--ink);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--white);
  font-weight: 600;
  margin-top: 1px;
}

.security-main {
  font-size: 12px;
  color: var(--ink);
  line-height: 1.7;
}

.security-main b {
  font-weight: 500;
}

.security-law {
  background: var(--white);
  border: 0.5px solid var(--line);
  border-radius: 7px;
  padding: 9px 12px;
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.7;
}

.security-law .law-ref {
  font-weight: 500;
  color: var(--ink);
}

.security-company {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.5;
}

.form-section {
  background: var(--white);
  border-radius: 12px;
  border: 0.5px solid var(--line);
  margin-bottom: 12px;
  overflow: hidden;
}

.form-section[hidden] {
  display: none;
}

.form-section-title {
  background: var(--ink);
  color: var(--white);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 2px;
  padding: 8px 16px;
}

.form-row {
  display: flex;
  align-items: center;
  padding: 11px 16px;
  border-bottom: 0.5px solid var(--bg);
  gap: 10px;
}

.form-row:last-child {
  border-bottom: none;
}

.form-label {
  flex-shrink: 0;
  width: 92px;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.4;
}

.form-label .req {
  color: var(--danger);
  margin-left: 2px;
}

.form-label .opt {
  color: #B5C4B7;
  font-size: 10.5px;
  margin-left: 2px;
}

.form-input {
  flex: 1;
  min-width: 0;
  width: 100%;
  border: none;
  outline: none;
  padding: 0;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
}

.form-input::placeholder {
  color: var(--line);
}

.form-input:disabled {
  opacity: 0.35;
}

select.form-input {
  min-height: 24px;
  color: var(--ink);
}

select.form-input:invalid {
  color: var(--line);
}

select.form-input option {
  color: var(--ink);
  background: var(--white);
}

select.form-input option:disabled {
  color: var(--line);
}

.gender-group {
  display: flex;
  gap: 8px;
  flex: 1;
}

.gender-btn {
  flex: 1;
  min-height: 34px;
  padding: 7px 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--ink-soft);
  background: var(--white);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}

.gender-btn.active {
  background: var(--ink);
  color: var(--white);
  border-color: var(--ink);
}

.hint-row {
  padding: 10px 16px;
  border-bottom: 0.5px solid var(--bg);
  background: var(--soft);
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.6;
}

.sent-row {
  padding: 10px 16px;
  border-bottom: 0.5px solid var(--bg);
  background: var(--soft);
}

.sent-check-label,
.iban-toggle-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.sent-check-label input[type="checkbox"],
.iban-toggle-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--ink);
  cursor: pointer;
  flex-shrink: 0;
}

.sent-text {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

.sent-text b {
  font-weight: 500;
  color: var(--ink-soft);
  font-size: 11.5px;
}

.iban-toggle-row {
  padding: 11px 16px;
  border-bottom: 0.5px solid var(--bg);
}

.iban-toggle-label span {
  font-size: 12.5px;
  color: var(--ink-soft);
}

.iban-toggle-label .iban-opt {
  font-size: 11px;
  color: #B5C4B7;
  margin-left: auto;
}

.required-note {
  display: none;
  padding: 10px 16px 4px;
  font-size: 11.5px;
  color: var(--danger);
  line-height: 1.5;
}

.submit-btn {
  width: 100%;
  min-height: 50px;
  padding: 15px;
  background: var(--ink);
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.submit-btn:active,
.copy-btn:active {
  opacity: 0.85;
}

.error-tip {
  display: none;
  background: #FEF0EF;
  border: 1px solid #F5C6C3;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--danger);
  margin-bottom: 12px;
  text-align: center;
}

.result-card {
  display: none;
  background: var(--white);
  border-radius: 12px;
  border: 0.5px solid var(--line);
  overflow: hidden;
  margin-bottom: 12px;
}

.result-title {
  background: var(--ink);
  color: var(--white);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 2px;
  padding: 8px 16px;
}

.result-body {
  padding: 14px 16px;
  font-size: 13px;
  color: var(--ink);
  line-height: 2;
  white-space: pre-wrap;
  word-break: break-word;
}

.copy-btn {
  display: none;
  width: 100%;
  min-height: 48px;
  padding: 14px;
  background: var(--ink-soft);
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 1px;
}

.copy-success {
  background: #2A5C36;
}

.footer {
  text-align: center;
  margin-top: 16px;
}

.footer-main {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.footer-sub {
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 2px;
}

@media (max-width: 420px) {
  body {
    padding-left: 12px;
    padding-right: 12px;
  }

  .type-switcher,
  .business-product-switcher {
    gap: 8px;
  }

  .type-btn {
    min-height: 62px;
  }

  .type-main {
    font-size: 12.5px;
  }

  .type-sub {
    font-size: 10px;
  }

  .form-label {
    width: 86px;
  }
}
</style>
</head>
<body>
<main class="page">
  <header class="brand-header">
    <div class="brand-avatar"><img id="avatarImg" src="alex-avatar.jpg" alt="Alex Qi"></div>
    <div class="brand-name">Alex Qi</div>
    <div class="brand-tag">合同严选</div>
    <div class="brand-title">合同信息收集</div>
  </header>

  <nav class="type-switcher" aria-label="选择合同类型">
    <button class="type-btn active" id="btn-energy" type="button" onclick="switchType('energy')">
      <span class="type-main">电 / 气</span>
      <span class="type-sub">IBAN 选填</span>
    </button>
    <button class="type-btn" id="btn-network" type="button" onclick="switchType('network')">
      <span class="type-main">网络</span>
      <span class="type-sub">IBAN 必填</span>
    </button>
    <button class="type-btn" id="btn-business" type="button" onclick="switchType('business')">
      <span class="type-main">商业</span>
      <span class="type-sub">电气网</span>
    </button>
  </nav>

  <div class="business-product-switcher" id="businessProductSwitcher" aria-label="选择商业合同业务">
    <button class="product-btn active" id="btn-business-energy" type="button" onclick="switchBusinessProduct('energy')">商业用电</button>
    <button class="product-btn" id="btn-business-gas" type="button" onclick="switchBusinessProduct('gas')">商业用气</button>
    <button class="product-btn" id="btn-business-network" type="button" onclick="switchBusinessProduct('network')">商业网络</button>
  </div>

  <section class="security-box" aria-label="数据用途说明">
    <div class="security-top">
      <div class="security-icon">i</div>
      <div class="security-main">
        以下信息<b>仅用于本次合同的签署与履行</b>，处理依据如下：
      </div>
    </div>
    <div class="security-law">
      <span class="law-ref">DSGVO Art. 6 Abs. 1 lit. b</span>：个人数据及公司信息的处理仅在履行合同所必要的范围内进行，不得用于任何合同目的之外的用途。
    </div>
    <div class="security-company">挂靠德国合规团队 Chen Coaching · manyreason，身份可查证</div>
  </section>

  <section class="form-section">
    <div class="form-section-title" id="person-title">个人信息</div>
    <div class="form-row">
      <div class="form-label">性别<span class="req">*</span></div>
      <div class="gender-group">
        <button class="gender-btn" type="button" data-value="Herr" onclick="selectGender(this)">男 (Herr)</button>
        <button class="gender-btn" type="button" data-value="Frau" onclick="selectGender(this)">女 (Frau)</button>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="f-lastname">姓<span class="req">*</span></label>
      <input class="form-input" id="f-lastname" type="text" placeholder="Nachname" autocomplete="family-name">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-firstname">名<span class="req">*</span></label>
      <input class="form-input" id="f-firstname" type="text" placeholder="Vorname" autocomplete="given-name">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-dob">出生日期<span class="req">*</span></label>
      <input class="form-input" id="f-dob" type="text" placeholder="TT.MM.JJJJ" inputmode="numeric" autocomplete="bday">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-email">邮箱<span class="req">*</span></label>
      <input class="form-input" id="f-email" type="email" placeholder="beispiel@email.com" inputmode="email" autocomplete="email">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-phone">手机号<span class="req">*</span></label>
      <input class="form-input" id="f-phone" type="tel" placeholder="+49 ..." inputmode="tel" autocomplete="tel">
    </div>
  </section>

  <section class="form-section" id="company-section" hidden>
    <div class="form-section-title">公司信息</div>
    <div class="form-row">
      <label class="form-label" for="f-company">公司名称<span class="req">*</span></label>
      <input class="form-input" id="f-company" type="text" placeholder="Firmenname" autocomplete="organization">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-legal-form">Rechtsform<span class="req">*</span></label>
      <select class="form-input" id="f-legal-form" required>
        <option value="" selected disabled>请选择公司形式</option>
        <option>Ohne</option>
        <option>AdöR</option>
        <option>AG</option>
        <option>AG &amp; Co. KG</option>
        <option>AG &amp; Co. OHG</option>
        <option>BGB</option>
        <option>e.G.</option>
        <option>e.K.</option>
        <option>e.V.</option>
        <option>Einzeluntern.</option>
        <option>EWIV</option>
        <option>G-REIT</option>
        <option>GbR</option>
        <option>gGmbH</option>
        <option>GmbH</option>
        <option>GmbH &amp; Co. KG</option>
        <option>GmbH &amp; Co. OHG</option>
        <option>HGB</option>
        <option>invAG</option>
        <option>KdöR</option>
        <option>KG</option>
        <option>KG &amp; Co. KG</option>
        <option>KGaA</option>
        <option>Ltd.</option>
        <option>Ltd. &amp; Co. KG</option>
        <option>OHG</option>
        <option>OHG &amp; Co. KG</option>
        <option>PartG</option>
        <option>SCE</option>
        <option>SE</option>
        <option>Stiftung &amp; Co. KG</option>
        <option>UG</option>
        <option>UG &amp; Co. KG</option>
        <option>VVaG</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="f-tax-number">税号<span class="opt">二选一</span></label>
      <input class="form-input" id="f-tax-number" type="text" placeholder="Steuernummer">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-vat-id">USt-IdNr<span class="opt">二选一</span></label>
      <input class="form-input" id="f-vat-id" type="text" placeholder="DE123456789">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-industry">行业<span class="req">*</span></label>
      <select class="form-input" id="f-industry" required>
        <option value="" selected disabled>请选择 Branche</option>
        <option>Arztpraxen u. sonst. Gesundheitswesen</option>
        <option>Bank- und Kreditgewerbe</option>
        <option>Baugewerbe, Klempnerei, Installateure</option>
        <option>Datenverarbeitungsdienstl. u. Reparatur</option>
        <option>Dienstleistung für Sport, Sportanlagen</option>
        <option>Dienstleistung für Unterhaltung, Freizeit</option>
        <option>Einzelhandel/Kaufhaus/Versandhandel</option>
        <option>Elektr., feinmech., mediz., opt. Geräte</option>
        <option>Filmtheater und Filmherstellung</option>
        <option>Friseurgewerbe/ Kosmetiksalons</option>
        <option>Gastgewerbe mit Beherbergung</option>
        <option>Gastronomie/Bar/Disco</option>
        <option>Großhandel</option>
        <option>Heime u. soziale Einrichtungen</option>
        <option>Herstellung von Büromsch. und DV-Geräten</option>
        <option>Immobilien u.Grundstücksdienstleistungen</option>
        <option>Kfz-Handel, Instandhaltung, Reparatur</option>
        <option>Land-, Forst- und Fischereiwirtschaft</option>
        <option>Markt- u. Meinungsforschung</option>
        <option>Möbel, Schmuck, Musik-,Sport/Spielgeräte</option>
        <option>Rechts-, Steuer-, Unternehmensberatung</option>
        <option>Religiöse Vereinigungen</option>
        <option>Reparatur von Gebrauchsgütern</option>
        <option>Saunen, Solarien, Fitnesszentren ua.</option>
        <option>Schulen und Tagesstätten</option>
        <option>Sonstiges Dienstleistungsgewerbe</option>
        <option>Spiel-, Wett- und Lotteriewesen</option>
        <option>Tankstellen</option>
        <option>Textil-, Bekleidungs- und Ledergewerbe</option>
        <option>Transport und Verkehr</option>
        <option>Ver- und Entsorgung</option>
        <option>Verbände, Parteien, Organisationen</option>
        <option>Versicherungsgewerbe</option>
        <option>Wäscherei und chemische Reinigung</option>
        <option>prod. Gewerbe Lebensmittel</option>
      </select>
    </div>
  </section>

  <section class="form-section">
    <div class="form-section-title" id="address-title">居住地址</div>
    <div class="form-row">
      <label class="form-label" for="f-street">街道名称<span class="req">*</span></label>
      <input class="form-input" id="f-street" type="text" placeholder="Straße" autocomplete="street-address">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-number">门牌号<span class="req">*</span></label>
      <input class="form-input" id="f-number" type="text" placeholder="Hausnummer">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-plz">邮政编码<span class="req">*</span></label>
      <input class="form-input" id="f-plz" type="text" placeholder="52062" inputmode="numeric" maxlength="5" autocomplete="postal-code">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-city">城市<span class="req">*</span></label>
      <input class="form-input" id="f-city" type="text" placeholder="Stadt" autocomplete="address-level2">
    </div>
  </section>

  <section class="form-section" id="section-contract">
    <div class="form-section-title" id="contract-title">电 / 气合同信息</div>
    <div class="hint-row" id="business-contract-hint" style="display:none;">商业电 / 气可填写表号和 MaLo-ID；商业网络不需要这两项。</div>

    <div id="block-zaehler">
      <div class="sent-row">
        <label class="sent-check-label" for="check-zaehler">
          <input type="checkbox" id="check-zaehler" onchange="toggleSent('zaehler', this)">
          <span class="sent-text"><b id="zaehler-check-label">电表号 (Zählernummer)</b> 已发给 Alex · 无需填写</span>
        </label>
      </div>
      <div class="form-row" id="row-zaehler">
        <label class="form-label" for="f-zaehler" id="zaehler-label">电表号<span class="opt">选填</span></label>
        <input class="form-input" id="f-zaehler" type="text" placeholder="Zählernummer">
      </div>
    </div>

    <div id="block-malo">
      <div class="sent-row">
        <label class="sent-check-label" for="check-malo">
          <input type="checkbox" id="check-malo" onchange="toggleSent('malo', this)">
          <span class="sent-text"><b>Marktlokations-ID</b> 已发给 Alex · 无需填写</span>
        </label>
      </div>
      <div class="form-row" id="row-malo">
        <label class="form-label" for="f-malo"><span style="font-size:11px;">MaLo-ID</span><span class="opt">选填</span></label>
        <input class="form-input" id="f-malo" type="text" placeholder="Marktlokations-ID">
      </div>
    </div>
  </section>

  <section class="form-section">
    <div class="form-section-title">银行信息</div>
    <div id="iban-toggle-row" class="iban-toggle-row">
      <label class="iban-toggle-label" for="iban-check">
        <input type="checkbox" id="iban-check" onchange="toggleIban(this)">
        <span>使用 IBAN 自动扣款</span>
        <span class="iban-opt">选填</span>
      </label>
    </div>
    <div id="iban-required-note" class="required-note">网络合同需要 IBAN 用于月费自动扣款</div>
    <div class="form-row" id="iban-row" style="display:none;">
      <label class="form-label" id="iban-label" for="f-iban">IBAN</label>
      <input class="form-input" id="f-iban" type="text" placeholder="DE89 3704 0044 0532 0130 00" autocomplete="off">
    </div>
  </section>

  <button class="submit-btn" type="button" onclick="submitForm()">生成信息 · 发给 Alex</button>
  <div class="error-tip" id="errorTip"></div>

  <section class="result-card" id="resultCard">
    <div class="result-title">请复制以下内容发给 Alex</div>
    <div class="result-body" id="resultText"></div>
  </section>
  <button class="copy-btn" id="copyBtn" type="button" onclick="copyResult()">一键复制 · 发给 Alex</button>

  <footer class="footer">
    <div class="footer-main">一次办理 · 终身托管</div>
    <div class="footer-sub">ALEX QI · 合同严选</div>
  </footer>
</main>

<script>
let currentType = 'energy';
let businessProduct = 'energy';
let selectedGender = '';

const businessProductLabels = {
  energy: '商业用电合同',
  gas: '商业用气合同',
  network: '商业网络合同',
};

function isBusiness() {
  return currentType === 'business';
}

function isNetworkContract() {
  return currentType === 'network' || (isBusiness() && businessProduct === 'network');
}

function shouldShowMeterFields() {
  return currentType === 'energy' || (isBusiness() && businessProduct !== 'network');
}

function switchType(type) {
  currentType = type;
  updateUi();
}

function switchBusinessProduct(product) {
  businessProduct = product;
  updateUi();
}

function updateUi() {
  document.getElementById('btn-energy').classList.toggle('active', currentType === 'energy');
  document.getElementById('btn-network').classList.toggle('active', currentType === 'network');
  document.getElementById('btn-business').classList.toggle('active', isBusiness());

  document.getElementById('businessProductSwitcher').style.display = isBusiness() ? 'grid' : 'none';
  document.getElementById('btn-business-energy').classList.toggle('active', businessProduct === 'energy');
  document.getElementById('btn-business-gas').classList.toggle('active', businessProduct === 'gas');
  document.getElementById('btn-business-network').classList.toggle('active', businessProduct === 'network');

  document.getElementById('company-section').hidden = !isBusiness();
  document.getElementById('person-title').textContent = isBusiness() ? '联系人 / 签约人信息' : '个人信息';
  document.getElementById('address-title').textContent = isBusiness() ? '公司 / 使用地址' : '居住地址';

  const contractTitle = currentType === 'energy'
    ? '电 / 气合同信息'
    : currentType === 'network'
      ? '网络合同信息'
      : businessProductLabels[businessProduct] + '信息';
  document.getElementById('contract-title').textContent = contractTitle;
  document.getElementById('business-contract-hint').style.display = isBusiness() ? '' : 'none';

  const showMeter = shouldShowMeterFields();
  document.getElementById('block-zaehler').style.display = showMeter ? '' : 'none';
  document.getElementById('block-malo').style.display = showMeter ? '' : 'none';

  const meterText = isBusiness() && businessProduct === 'gas' ? '气表号' : isBusiness() ? '表号' : '电表号';
  document.getElementById('zaehler-label').innerHTML = meterText + '<span class="opt">选填</span>';
  document.getElementById('zaehler-check-label').textContent = meterText + ' (Zählernummer)';

  const ibanToggleRow = document.getElementById('iban-toggle-row');
  const ibanRequiredNote = document.getElementById('iban-required-note');
  const ibanRow = document.getElementById('iban-row');
  const ibanLabel = document.getElementById('iban-label');
  const ibanCheck = document.getElementById('iban-check');

  if (isNetworkContract()) {
    ibanToggleRow.style.display = 'none';
    ibanRequiredNote.style.display = '';
    ibanRow.style.display = 'flex';
    ibanLabel.innerHTML = 'IBAN<span style="color:#C0392B;margin-left:2px;">*</span>';
  } else {
    ibanToggleRow.style.display = '';
    ibanRequiredNote.style.display = 'none';
    ibanRow.style.display = ibanCheck.checked ? 'flex' : 'none';
    ibanLabel.textContent = 'IBAN';
  }
}

function selectGender(btn) {
  document.querySelectorAll('.gender-btn').forEach(button => button.classList.remove('active'));
  btn.classList.add('active');
  selectedGender = btn.dataset.value;
}

function toggleSent(field, cb) {
  const row = document.getElementById('row-' + field);
  const input = document.getElementById('f-' + field);
  if (cb.checked) {
    row.style.display = 'none';
    input.value = '__已发给Alex__';
  } else {
    row.style.display = 'flex';
    input.value = '';
  }
}

function toggleIban(cb) {
  const row = document.getElementById('iban-row');
  row.style.display = cb.checked ? 'flex' : 'none';
  if (!cb.checked) document.getElementById('f-iban').value = '';
}

function getValue(id) {
  return document.getElementById(id).value.trim();
}

function focusField(id) {
  document.getElementById(id).focus();
}

function validate() {
  if (!selectedGender) {
    showError('请选择性别');
    return false;
  }

  const required = [
    { id: 'f-lastname', label: '姓' },
    { id: 'f-firstname', label: '名' },
    { id: 'f-dob', label: '出生日期' },
    { id: 'f-email', label: '邮箱' },
    { id: 'f-phone', label: '手机号' },
    { id: 'f-street', label: '街道名称' },
    { id: 'f-number', label: '门牌号' },
    { id: 'f-plz', label: '邮政编码' },
    { id: 'f-city', label: '城市' },
  ];

  for (const field of required) {
    if (!getValue(field.id)) {
      showError('请填写「' + field.label + '」');
      focusField(field.id);
      return false;
    }
  }

  if (isBusiness()) {
    const businessRequired = [
      { id: 'f-company', label: '公司名称' },
      { id: 'f-legal-form', label: 'Rechtsform' },
      { id: 'f-industry', label: '行业' },
    ];

    for (const field of businessRequired) {
      if (!getValue(field.id)) {
        showError('请填写「' + field.label + '」');
        focusField(field.id);
        return false;
      }
    }

    if (!getValue('f-tax-number') && !getValue('f-vat-id')) {
      showError('税号或 USt-IdNr 至少填写一个');
      focusField('f-tax-number');
      return false;
    }
  }

  if (isNetworkContract() && !getValue('f-iban')) {
    showError('网络合同需要填写 IBAN');
    focusField('f-iban');
    return false;
  }

  return true;
}

function showError(msg) {
  const el = document.getElementById('errorTip');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => {
    el.style.display = 'none';
  }, 3000);
}

function getTypeLabel() {
  if (currentType === 'energy') return '电 / 气合同';
  if (currentType === 'network') return '网络合同';
  return businessProductLabels[businessProduct];
}

function appendMeterLines(lines) {
  if (!shouldShowMeterFields()) return;

  const zaehler = getValue('f-zaehler');
  const malo = getValue('f-malo');
  const zaehlerSent = document.getElementById('check-zaehler').checked;
  const maloSent = document.getElementById('check-malo').checked;
  const meterLabel = isBusiness() && businessProduct === 'gas' ? '气表号' : isBusiness() ? '表号' : '电表号';

  lines.push('─────────────────');
  if (zaehlerSent) {
    lines.push(meterLabel + '：（已单独发送给 Alex）');
  } else if (zaehler) {
    lines.push(meterLabel + '：' + zaehler);
  } else {
    lines.push(meterLabel + '：暂无');
  }

  if (maloSent) {
    lines.push('MaLo-ID：（已单独发送给 Alex）');
  } else if (malo) {
    lines.push('MaLo-ID：' + malo);
  } else {
    lines.push('MaLo-ID：暂无');
  }
}

function submitForm() {
  if (!validate()) return;

  const lines = [
    '【' + getTypeLabel() + '信息】',
    '─────────────────',
  ];

  if (isBusiness()) {
    lines.push('公司名称：' + getValue('f-company'));
    lines.push('Rechtsform：' + getValue('f-legal-form'));
    lines.push('行业 Branche：' + getValue('f-industry'));
    if (getValue('f-tax-number')) lines.push('税号 Steuernummer：' + getValue('f-tax-number'));
    if (getValue('f-vat-id')) lines.push('USt-IdNr：' + getValue('f-vat-id'));
    lines.push('─────────────────');
  }

  lines.push('性别：' + (selectedGender === 'Herr' ? '男（Herr）' : '女（Frau）'));
  lines.push('姓：' + getValue('f-lastname'));
  lines.push('名：' + getValue('f-firstname'));
  lines.push('出生日期：' + getValue('f-dob'));
  lines.push('邮箱：' + getValue('f-email'));
  lines.push('手机号：' + getValue('f-phone'));
  lines.push('─────────────────');
  lines.push((isBusiness() ? '使用地址：' : '街道：') + getValue('f-street') + ' ' + getValue('f-number'));
  lines.push('邮政编码：' + getValue('f-plz'));
  lines.push('城市：' + getValue('f-city'));

  appendMeterLines(lines);

  const ibanVal = getValue('f-iban');
  const ibanCheck = document.getElementById('iban-check');
  const hasIban = isNetworkContract() ? !!ibanVal : (ibanCheck.checked && !!ibanVal);
  if (hasIban) {
    lines.push('─────────────────');
    lines.push('IBAN：' + ibanVal);
  }

  lines.push('─────────────────');
  lines.push('本人确认：以上信息依据 DSGVO Art. 6 Abs. 1 lit. b 授权用于本次合同签署与履行');

  const text = lines.join('\n');
  document.getElementById('resultText').textContent = text;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'block';

  setTimeout(() => {
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

function copyResult() {
  const text = document.getElementById('resultText').textContent;
  const btn = document.getElementById('copyBtn');

  const done = () => {
    btn.textContent = '已复制，发给 Alex 就好';
    btn.classList.add('copy-success');
    setTimeout(() => {
      btn.textContent = '一键复制 · 发给 Alex';
      btn.classList.remove('copy-success');
    }, 2500);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }
}

updateUi();
</script>
</body>
</html>
